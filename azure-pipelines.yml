trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  dockerRegistryServiceConnection: '470f6d78-f0c3-48a3-86bb-16bf34680ebc'
  imageRepository: 'caircompanion'
  tag: '$(Build.BuildId)'

steps:
- task: NodeTool@0
  displayName: Use Node.js 20
  inputs:
    versionSpec: $(nodeVersion)

- script: npm install --legacy-peer-deps
  displayName: Install dependencies

- script: |
    sed -i "s|base: '/caircompanion/'|base: '/'|" vite.config.ts
    npm run build
  displayName: Build production bundle
  env:
    VITE_API_BASE_URL: $(VITE_API_BASE_URL)

- script: |
    printf '%s\n' \
      'FROM nginx:1.27-alpine' \
      'COPY dist /usr/share/nginx/html' \
      'EXPOSE 80' > Dockerfile
  displayName: Create production container definition

- task: Docker@2
  displayName: Build and push container
  inputs:
    command: buildAndPush
    repository: $(imageRepository)
    dockerfile: Dockerfile
    containerRegistry: $(dockerRegistryServiceConnection)
    tags: |
      $(tag)
      latest
