trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  VITE_API_BASE_URL: 'https://api.cairiqhealth.ai'
  dockerRegistryServiceConnection: '470f6d78-f0c3-48a3-86bb-16bf34680ebc'
  imageRepository: 'caircompanion'
  containerRegistry: 'cairiqacr.azurecr.io'
  tag: '$(Build.BuildId)'
  kubernetesServiceConnection: 'DEV-AKS-NS'
  aksNamespace: 'dev-cairiq'

stages:
- stage: Build
  displayName: Build and push image
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: NodeTool@0
      displayName: Use Node.js 20
      inputs:
        versionSpec: $(nodeVersion)

    - script: npm install --legacy-peer-deps
      displayName: Install dependencies

    - task: SonarQubePrepare@7
      displayName: Prepare SonarQube analysis
      inputs:
        SonarQube: 'new-sonar-server'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'caircompanion'
        cliProjectName: 'CairCompanion'
        cliSources: 'src'
        extraProperties: |
          sonar.sourceEncoding=UTF-8
          sonar.tests=src
          sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
          sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
          sonar.javascript.lcov.reportPaths=coverage/lcov.info
          sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts

    - script: npm run test:coverage
      displayName: Run tests with coverage

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
        pathToSources: '$(System.DefaultWorkingDirectory)/src'
        failIfCoverageEmpty: true

    - task: PublishPipelineArtifact@1
      displayName: Publish HTML coverage report
      condition: succeededOrFailed()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/coverage'
        artifact: 'code-coverage-report'

    - task: SonarQubeAnalyze@7
      displayName: Run SonarQube analysis

    - task: SonarQubePublish@7
      displayName: Publish SonarQube quality gate
      inputs:
        pollingTimeoutSec: '300'

    - script: |
        sed -i "s|base: '/caircompanion/'|base: '/'|" vite.config.ts
        npm run build
      displayName: Build production bundle
      env:
        VITE_API_BASE_URL: $(VITE_API_BASE_URL)

    - script: |
        printf '%s\n' \
          'FROM cairiqacr.azurecr.io/base/nginx:1.27-alpine' \
          'COPY nginx.conf /etc/nginx/conf.d/default.conf' \
          'COPY dist /usr/share/nginx/html' \
          'EXPOSE 80' > Dockerfile
      displayName: Create production container definition

    - task: Docker@2
      displayName: Build and push container
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to DEV AKS
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy CairCompanion
    steps:
    - task: Kubernetes@1
      displayName: Update CairCompanion image
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: $(aksNamespace)
        command: set
        arguments: image deployment/caircompanion caircompanion=$(containerRegistry)/$(imageRepository):$(tag)

    - task: Kubernetes@1
      displayName: Wait for rollout
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: $(aksNamespace)
        command: rollout
        arguments: status deployment/caircompanion --timeout=180s
